<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name=" viewport "
      content=" width = device - width , initial - scale =1.0 "
    />

    <title>MiniForum - Home Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>MiniForum</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home page</a></li>
          <li><a href="inscription.html">Inscription</a></li>
          <li><a href="connexion.html">Connexion</a></li>
          <li><a href="#subjects">Subjects</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="subjects">
        <h2>Recent Subjects</h2>
        <article>
          <a href="subject.html">Subject</a>
          <br><label
            ><strong
              >author: <br />
              categorie :
            </strong></label
          >
          <p></p>
        </article>

        <article>
          <h3>empty</h3>
          <label
            ><strong
              >author : <br />
              categorie :
            </strong></label
          >
          <p></p>
        </article>

        <article>
          <h3>empty</h3>
          <label
            ><strong
              >author : <br />
              categorie :
            </strong></label
          >
          <p></p>
        </article>
      </section>
      <section id = "NewSubjects">
        <h2>New Subject</h2>
        <form action = /topics method="post">
          <fieldset>
            <legend>Your Message</legend>
            <p>
            <label for = "pseudo">Pseudo</label>
            <input type = "text" id = "pseudo" name = "pseudo" placeholder="Example: alice" required>
            </p>
            <p>
            <label for = "title">Subject Title</label>
            <input type = "text" id = "title" name = "title" maxlength="80" required>
            </p>
            <p>
            <label for = "message">Message</label>
            <textarea id = "message" name = "message" rows = "6" maxlength="500" required>
            </textarea>
            </p>
          </fieldset>
          <fieldset>
            <legend>Publication Options</legend>
            <p>
              <label for = "categorie">Categories</label>
              <select id = "categorie" name = categorie>
                <option value = "general">General</option>
                <option value = "help">Help</option>
                <option value = "projects">Projects</option>
              </select>
            </p>
            <p>
              <label>Visibility -></label>
              <input type = "radio" id = "visibility-public" name = "visibility" value = "public">
              <label for = "visibility-public">Public</label>
              <input type = "radio" id = "visibility-private" name = "visibility" value = "private">
              <label for = "visibility-private">Private</label>
            </p>
            <button type = "submit" id = "optionsPubli">Send</button>
          </fieldset>
        </form> 
      </section>
    </main>

    <footer>
      <p>project name</p>
      <p>mention of the class</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
