<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miniforum - Inscription</title>
  </head>
<body>
    <header>
      <h1>MiniForum</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home page</a></li>
          <li><a href="inscription.html">Inscription</a></li>
          <li><a href="connexion.html">Connexion</a></li>
        </ul>
      </nav>
    </header>

    <main>
        <h2>Make an account</h2>
        <form action = "/inscription" method = "post">
            <fieldset>
                <legend>Identification</legend>
                <p>
                <label for = "pseudo">Pseudo</label>
                <input type = "text" id = "pseudo" name = "pseudo" pattern ="[a-zA-Z0-9]{3,15}" title = "3 à 15 lettres ou chiffres uniquement" required>
                </p>
                <p>
                <label for = "email">Adresse Email</label>
                <input type ="email" id = "email" name = "email" required>
                </p>
                 <p>
                <label for = "password">Password</label>
                <input type ="password" id = "password" name = "password" minlength="8" required>
                </p>
                <p>
                <label for = "birth">Birth Date</label>
                <input type ="date" id = "birth" name = "birth" required>
                </p>  
            </fieldset>
            <fieldset>
                <legend>Preferences</legend>
                <p>
                    <label for = "newsletter">Revevoir la lettre de information</label>
                    <input type = "checkbox" id = "newsletter" name = "newsletter">
                </p>
                <p>
                    <label for = "cgu">J'accepte les conditions d'utilisations</label>
                    <input type = "checkbox" id = "cgu" name = "cgu">
                </p>
            </fieldset>
            <button type = "submit">Create my Account</button>
            <a href = "connexion.html"><br>Connexion</br></a>
        </form>
    </main>
    
</body>
<footer>
    <p>project name</p>
  <p>mention of the class</p>
 </footer>
</html>
