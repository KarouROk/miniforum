<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miniforum - Connexion</title>
  </head>
  <body>
    <header>
      <h1>MiniForum</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home page</a></li>
          <li><a href="inscription.html">Inscription</a></li>
          <li><a href="connexion.html">Connexion</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Connexion</h2>
      <form action="connexion" method="post">
        <fieldset>
          <legend>Your identifications</legend>
          <p>
            <label for="identifiants">Pseudo/Adresse e-mail</label>
            <input type="text" id="identifiants" name="identifiants" required />
          </p>
          <p>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </p>
          <p>
            <label for="connected">Stay connected on this device</label>
            <input type="checkbox" id="connected" name="connected" />
          </p>
          <button type="submit">Connect</button>
          <a href="inscription.html">Pas encore de compte?S'inscrire</a>
        </fieldset>
      </form>
    </main>
    <footer>
      <p>project name</p>
      <p>mention of the class</p>
    </footer>
  </body>
</html>
